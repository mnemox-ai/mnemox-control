[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mnemox-control"
version = "0.3.0"
description = "Deterministic risk-control and decision-evidence contracts for agentic trading"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "LICENSES/AGPL-3.0.txt"]
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
dev = [
  "build>=1.3",
  "hypothesis>=6.138",
  "mypy>=1.18",
  "pytest>=9.0",
  "ruff>=0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mnemox_control"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mnemox_control"]
